<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MuleSoft Capacity Planner</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="capacity-glossary.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="topbar">
    <div class="brand"><span class="brand-mark" aria-hidden="true">M</span><div><strong>MuleSoft Capacity Planner</strong><small>License governance workspace</small></div></div>
    <div class="month-controls" aria-label="Reporting month">
      <button id="prev-month" class="icon-button" title="Previous month" aria-label="Previous month">‹</button>
      <label><span class="sr-only">Selected month</span><input id="selected-month" type="month"></label>
      <button id="next-month" class="icon-button" title="Next month" aria-label="Next month">›</button>
      <button id="today-month" class="quiet-button">Today</button>
    </div>
  </header>
  <div class="app-shell">
    <aside class="sidebar">
      <nav aria-label="Primary">
        <button class="nav-item active" data-view="dashboard"><span>◫</span> Dashboard</button>
        <button class="nav-item" data-view="apis"><span>◇</span> APIs</button>
        <button class="nav-item" data-view="projects"><span>▣</span> Projects</button>
        <button class="nav-item" data-view="capacity"><span>▤</span> License Capacity</button>
        <button class="nav-item" data-view="reserve"><span>⬡</span> Strategic Reserve</button>
        <button class="nav-item" data-view="forecast"><span>↗</span> Monthly Forecast</button>
        <button class="nav-item" data-view="data"><span>⇄</span> Import / Export</button>
      </nav>
      <div class="sidebar-note"><span class="status-dot"></span><div><strong>Stored locally</strong><small>No data leaves this browser</small></div></div>
    </aside>
    <main id="main" tabindex="-1">
      <div id="alert-region" aria-live="polite"></div>
      <section id="view-dashboard" class="view active"></section>
      <section id="view-apis" class="view"></section>
      <section id="view-projects" class="view"></section>
      <section id="view-capacity" class="view"></section>
      <section id="view-reserve" class="view"></section>
      <section id="view-forecast" class="view"></section>
      <section id="view-data" class="view"></section>
    </main>
  </div>

  <dialog id="modal"><form method="dialog" id="modal-form"><div class="modal-head"><div><p id="modal-eyebrow" class="eyebrow"></p><h2 id="modal-title"></h2></div><button type="button" class="icon-button" data-close aria-label="Close">×</button></div><div id="modal-body" class="modal-body"></div><div id="modal-actions" class="modal-actions"></div></form></dialog>
  <dialog id="confirm-dialog"><form method="dialog"><div class="modal-head"><div><p class="eyebrow">Review impact</p><h2 id="confirm-title">Save this change?</h2></div></div><div id="confirm-body" class="modal-body"></div><div class="modal-actions"><button value="cancel" class="quiet-button">Cancel</button><button value="confirm" class="primary-button">Save anyway</button></div></form></dialog>
  <input id="import-file" type="file" accept="application/json,.json" hidden>
  <script src="js/timelines.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/calculations.js"></script>
  <script src="js/sample-data.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
