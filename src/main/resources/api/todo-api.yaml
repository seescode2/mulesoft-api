openapi: 3.0.3
info:
  title: Todo and Project API
  version: 1.0.0
  description: A small project-planning API that manages todos and projects.
servers:
  - url: /api/v1
paths:
  /todos:
    get:
      operationId: listTodos
      summary: List todos
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/TodoStatus' }
      responses:
        '200':
          description: Todos, optionally filtered by status.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Todo' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: createTodo
      summary: Create a todo
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TodoCreateRequest' }
      responses:
        '201':
          description: Todo created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Todo' }
        '400': { $ref: '#/components/responses/Error' }
  /todos/{todoId}:
    parameters:
      - $ref: '#/components/parameters/TodoId'
      - $ref: '#/components/parameters/CorrelationId'
    get:
      operationId: getTodo
      summary: Get a todo
      responses:
        '200':
          description: The todo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Todo' }
        '404': { $ref: '#/components/responses/Error' }
    put:
      operationId: updateTodo
      summary: Update a todo
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TodoUpdateRequest' }
      responses:
        '200':
          description: Todo updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Todo' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteTodo
      summary: Delete a todo
      responses:
        '204': { description: Todo deleted. }
        '404': { $ref: '#/components/responses/Error' }
  /projects:
    get:
      operationId: listProjects
      summary: List projects
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ProjectStatus' }
      responses:
        '200':
          description: Projects, optionally filtered by status.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Project' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: createProject
      summary: Create a project
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectCreateRequest' }
      responses:
        '201':
          description: Project created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '400': { $ref: '#/components/responses/Error' }
  /projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/CorrelationId'
    get:
      operationId: getProject
      summary: Get a project
      responses:
        '200':
          description: The project.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '404': { $ref: '#/components/responses/Error' }
    put:
      operationId: updateProject
      summary: Update a project
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectUpdateRequest' }
      responses:
        '200':
          description: Project updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteProject
      summary: Delete a project
      responses:
        '204': { description: Project deleted. }
        '404': { $ref: '#/components/responses/Error' }
components:
  parameters:
    CorrelationId:
      name: x-correlation-id
      in: header
      required: false
      schema: { type: string }
    TodoId:
      name: todoId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
  responses:
    Error:
      description: Request failed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    TodoStatus:
      type: string
      enum: [pending, completed]
    ProjectStatus:
      type: string
      enum: [planned, active, completed]
    Todo:
      type: object
      additionalProperties: false
      required: [id, title, status, createdAt, updatedAt]
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/TodoStatus' }
        dueDate: { type: string, format: date, nullable: true }
        projectId: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    TodoCreateRequest:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: { type: string, minLength: 1 }
        description: { type: string }
        dueDate: { type: string, format: date }
        projectId: { type: string }
    TodoUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string, minLength: 1 }
        description: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/TodoStatus' }
        dueDate: { type: string, format: date, nullable: true }
        projectId: { type: string, nullable: true }
    Project:
      type: object
      additionalProperties: false
      required: [id, name, status, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/ProjectStatus' }
        targetDate: { type: string, format: date, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ProjectCreateRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        targetDate: { type: string, format: date }
    ProjectUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/ProjectStatus' }
        targetDate: { type: string, format: date, nullable: true }
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error, message]
      properties:
        error: { type: string }
        message: { type: string }
